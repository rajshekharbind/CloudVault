version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudvault}
      POSTGRES_USER: ${POSTGRES_USER:-cloudvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    command: gunicorn cloudvault.wsgi:application --workers 3 --bind 0.0.0.0:8000
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    restart: always

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/usr/share/nginx/html/static:ro
      - media_volume:/usr/share/nginx/html/media:ro
    depends_on:
      - web
    restart: always

  redis:
    image: redis:7
    restart: always

volumes:
  pgdata:
  static_volume:
  media_volume:
