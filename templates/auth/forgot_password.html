{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password – CloudVault Enterprise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="glass-panel p-4 p-md-5 w-100" style="max-width: 440px;">
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.75rem;">
                <i class="bi bi-key-fill"></i>
            </div>
            <h4 class="fw-bold">Reset Password</h4>
            <p class="text-muted small">Enter your email address to receive password reset instructions.</p>
        </div>

        <form method="POST" action="{% url 'forgot_password' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold small">Email Address</label>
                <input type="email" name="email" class="form-control bg-transparent text-main border-glass" placeholder="name@company.com" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-semibold shadow-sm mt-3">
                Send Reset Link <i class="bi bi-send me-1"></i>
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-glass">
            <a href="{% url 'login' %}" class="small text-primary fw-semibold text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Sign In</a>
        </div>
    </div>

</body>
</html>
