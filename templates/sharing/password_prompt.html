{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Protected – CloudVault</title>
    <script>
        (function() {
            try {
                const saved = localStorage.getItem('cv_theme');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
            } catch (error) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="glass-panel p-4 p-md-5 w-100" style="max-width: 440px;">
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.75rem; background: linear-gradient(135deg, #ef4444 0%, #f59e0b 100%);">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h4 class="fw-bold">Password Protected Link</h4>
            <p class="text-muted small">This shared link requires a password to unlock access.</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} small" role="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold small">Enter Access Password</label>
                <input type="password" name="password" class="form-control bg-transparent text-main border-glass" placeholder="Password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-semibold shadow-sm">
                Unlock Shared Link <i class="bi bi-key me-1"></i>
            </button>
        </form>
    </div>

</body>
</html>
