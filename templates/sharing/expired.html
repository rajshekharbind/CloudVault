{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Expired – CloudVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="glass-panel p-4 p-md-5 w-100 text-center" style="max-width: 440px;">
        <i class="bi bi-clock-history text-danger display-1 mb-3 d-block"></i>
        <h4 class="fw-bold mb-2">Share Link Expired</h4>
        <p class="text-muted small">This share link has reached its expiration time or download limit and is no longer active.</p>
        <a href="/" class="btn btn-outline-primary btn-sm rounded-pill px-4 mt-2">Return to CloudVault Home</a>
    </div>

</body>
</html>
