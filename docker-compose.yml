version: '3.8'

services:
  web:
    build: .
    # Use Daphne ASGI server so Channels (WebSockets) work correctly
    command: daphne -b 0.0.0.0 -p 8000 cloudvault.asgi:application
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-cloudvault-prod-key-123456789
      - DB_HOST=db
      - DB_NAME=cloudvault
      - DB_USER=cloudvault_user
      - DB_PASSWORD=cloudvault_pass
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=cloudvault
      - POSTGRES_USER=cloudvault_user
      - POSTGRES_PASSWORD=cloudvault_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
